name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and pull
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BRANCH_NAME
          script: |
            set -e

            migrate_existing_db() {
              DB_DIR="$1"
              mkdir -p "$DB_DIR"

              if [ ! -e "$DB_DIR/umrah.db" ] && [ -e "umrah.db" ]; then
                for file in umrah.db umrah.db-wal umrah.db-shm; do
                  if [ -e "$file" ]; then
                    mv "$file" "$DB_DIR/$file"
                  fi
                done
              fi
            }

            deploy_app() {
              APP_DIR="$1"
              BRANCH="$2"
              APP_NAME="$3"
              APP_DB_PATH="$4"
              APP_DB_DIR="$(dirname "$APP_DB_PATH")"
              APP_DEPLOYMENT_ENV="production"
              APP_WORKSPACES_ENABLED="false"
              APP_PROD_WORKSPACES_ENABLED="true"
              APP_ORPHAN_TEST_COMPANY=""
              APP_ORPHAN_TEST_COUNT=""
              if [ "$BRANCH" = "staging" ]; then
                APP_DEPLOYMENT_ENV="staging"
                APP_PROD_WORKSPACES_ENABLED="false"
                # User-approved recovery: five orphan trips belong to a new testing company.
                APP_WORKSPACES_ENABLED="true"
                APP_ORPHAN_TEST_COMPANY="Staging Testing Company"
                APP_ORPHAN_TEST_COUNT="5"
              fi

              cd "$APP_DIR"
              pm2 stop "$APP_NAME" || true
              migrate_existing_db "$APP_DB_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              rm -rf dist/
              rm -rf node_modules
              npm ci
              npm run build
              node scripts/package-extension.mjs
              STAGING_ORPHAN_TRIP_COMPANY="$APP_ORPHAN_TEST_COMPANY" STAGING_ORPHAN_TRIP_COUNT="$APP_ORPHAN_TEST_COUNT" STAGING_WORKSPACES_ENABLED="$APP_WORKSPACES_ENABLED" PRODUCTION_WORKSPACES_ENABLED="$APP_PROD_WORKSPACES_ENABLED" UMRAH_DEPLOYMENT_ENV="$APP_DEPLOYMENT_ENV" DB_PATH="$APP_DB_PATH" pm2 restart "$APP_NAME" --update-env || STAGING_ORPHAN_TRIP_COMPANY="$APP_ORPHAN_TEST_COMPANY" STAGING_ORPHAN_TRIP_COUNT="$APP_ORPHAN_TEST_COUNT" STAGING_WORKSPACES_ENABLED="$APP_WORKSPACES_ENABLED" PRODUCTION_WORKSPACES_ENABLED="$APP_PROD_WORKSPACES_ENABLED" UMRAH_DEPLOYMENT_ENV="$APP_DEPLOYMENT_ENV" DB_PATH="$APP_DB_PATH" pm2 start npm --name "$APP_NAME" -- start
              if [ "$BRANCH" = "main" ]; then
                UMRAH_DEPLOYMENT_ENV=production ./node_modules/.bin/tsx scripts/verify-workspaces.ts --db "$APP_DB_PATH"
                PROD_PORT="$(pm2 jlist | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>{const item=JSON.parse(input).find(item=>item.name==="umrah-prod");console.log(Number.parseInt(item?.pm2_env?.PORT,10)||3000);});')"
                PROD_HTTP_STATUS=""
                for attempt in $(seq 1 30); do
                  PROD_HTTP_STATUS="$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PROD_PORT}/api/account" || true)"
                  if [ "$PROD_HTTP_STATUS" = "401" ]; then break; fi
                  sleep 1
                done
                if [ "$PROD_HTTP_STATUS" != "401" ]; then
                  echo "Production HTTP auth health check failed."
                  return 1
                fi
                echo "Production HTTP auth health verified."
              fi
              if [ "$BRANCH" = "staging" ]; then
                # Print only safe staging runtime fields, never PM2's complete secret environment.
                pm2 jlist | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>{const processInfo=JSON.parse(input).find(item=>item.name==="umrah-staging");const env=processInfo?.pm2_env;console.log("Staging runtime:",JSON.stringify({status:env?.status,cwd:env?.pm_cwd,script:env?.pm_exec_path,deploymentEnvironment:env?.UMRAH_DEPLOYMENT_ENV,databasePath:env?.DB_PATH}));});'
                if [ "$APP_WORKSPACES_ENABLED" = "true" ] && ! UMRAH_DEPLOYMENT_ENV=staging ./node_modules/.bin/tsx scripts/verify-workspaces.ts --db "$APP_DB_PATH"; then
                  pm2 logs "$APP_NAME" --lines 30 --nostream --err | grep -E 'Error:|SQLITE_|server.ts|server/migrations' || true
                  return 1
                fi
                if [ "$APP_WORKSPACES_ENABLED" != "true" ]; then
                  echo "Staging workspace migration disabled: orphan trip ownership requires review."
                  node --input-type=module -e 'import {inspectWorkspaceReadiness} from "./scripts/workspace-readiness.mjs";const report=inspectWorkspaceReadiness({dbPath:process.argv[1]});console.log("Staging migration review:",JSON.stringify({totals:report.totals,orphanTripCount:report.orphanTripCount,invalidTripJsonCount:report.invalidTripJsonCount}));' "$APP_DB_PATH"
                fi
                STAGING_PORT="$(pm2 jlist | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>{const item=JSON.parse(input).find(item=>item.name==="umrah-staging");console.log(Number.parseInt(item?.pm2_env?.PORT,10)||3000);});')"
                STAGING_HTTP_STATUS=""
                for attempt in $(seq 1 30); do
                  STAGING_HTTP_STATUS="$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${STAGING_PORT}/api/account" || true)"
                  if [ "$STAGING_HTTP_STATUS" = "401" ]; then break; fi
                  sleep 1
                done
                if [ "$STAGING_HTTP_STATUS" != "401" ]; then
                  echo "Staging HTTP auth health check failed."
                  return 1
                fi
                echo "Staging HTTP auth health verified."
              fi
            }

            install_backup_cron() {
              NODE_BIN="$(command -v node)"
              printf '%s\n' \
                'SHELL=/bin/bash' \
                'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin' \
                "0 * * * * root cd /var/www/umrah-prod && ${NODE_BIN} scripts/db-backup.mjs backup --db /var/lib/umrah/prod/umrah.db --dir /var/backups/umrah/prod --keep 168 >> /var/log/umrah-db-backup.log 2>&1" \
                "0 * * * * root cd /var/www/umrah-staging && ${NODE_BIN} scripts/db-backup.mjs backup --db /var/lib/umrah/staging/umrah.db --dir /var/backups/umrah/staging --keep 168 >> /var/log/umrah-db-backup.log 2>&1" \
                >/etc/cron.d/umrah-db-backup
            }

            run_backup_tasks() {
              APP_DIR="$1"
              DB_PATH_TO_BACKUP="$2"
              BACKUP_DIR="$3"

              if [ "$(id -u)" -ne 0 ]; then
                echo "Skipping backup setup: deploy user is not root."
                return 0
              fi

              NODE_BIN="$(command -v node)"
              # A staging deployment must not rewrite production cron configuration.
              if [ "$BRANCH_NAME" = "main" ]; then
                install_backup_cron
              fi
              cd "$APP_DIR"
              "$NODE_BIN" scripts/db-backup.mjs backup --db "$DB_PATH_TO_BACKUP" --dir "$BACKUP_DIR" --keep 168
            }

            if [ "$BRANCH_NAME" = "main" ]; then
              run_backup_tasks /var/www/umrah-prod /var/lib/umrah/prod/umrah.db /var/backups/umrah/prod
              deploy_app /var/www/umrah-prod main umrah-prod /var/lib/umrah/prod/umrah.db
              run_backup_tasks /var/www/umrah-prod /var/lib/umrah/prod/umrah.db /var/backups/umrah/prod
            else
              deploy_app /var/www/umrah-staging staging umrah-staging /var/lib/umrah/staging/umrah.db
              run_backup_tasks /var/www/umrah-staging /var/lib/umrah/staging/umrah.db /var/backups/umrah/staging
            fi
        env:
          BRANCH_NAME: ${{ github.ref_name }}
